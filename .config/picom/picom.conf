# Backend & Drivers (Hardware Accelerated GLX for Haswell)
backend = "glx";
vsync = true;
use-damage = true;

# Rounded Corners
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Soft Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS"
];

# Window Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

# Opacity Rules
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Google-chrome'",
  "100:class_g = 'Helium'",
  "100:class_g = 'Code'",
  "95:class_g = 'Alacritty'",
  "95:class_g = 'kitty'"
];
