# Backend & Drivers (Hardware Accelerated GLX for Haswell)
backend = "glx";
vsync = true;
use-damage = true;

# Smooth & Snappy Hardware Fading (Zero CPU Cost)
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;
no-fading-openclose = false;
no-fading-destroyed-argb = true;

# Don't fade full-screen apps to maintain 60 FPS in games/video
fade-exclude = [
  "fullscreen"
];


# Rounded Corners
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Soft Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS"
];

# Window Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

# Opacity Rules
inactive-opacity = 0.79;
active-opacity = 1.0;
frame-opacity = 0.90;
opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Google-chrome'",
  "100:class_g = 'Helium'",
  "100:class_g = 'Code'",
  "95:class_g = 'Alacritty'",
  "95:class_g = 'kitty'"
];
# ==============================================================================
# Lightweight Hardware Blur (Low GPU/CPU Cost)
# ==============================================================================
blur: {
  method = "dual_kawase";
  strength = 4;
  background = true;
};

blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS",
  "class_g = 'slop'"
];

