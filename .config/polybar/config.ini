include-file = ~/.config/polybar/colors-matugen.ini

[bar/main]
# 1. Floating Dimensions (Centered 85% width)
width = 86%
height = 28pt
offset-x = 7%
offset-y = 8px
radius = 12
fixed-center = true

# 2. Force i3 to let it float
override-redirect = true
wm-restack = i3

# 3. Disable the dock tray on this floating bar

# ... (keep your background, foreground, fonts, and modules as they are) ...




background = #b31e1e2e
foreground = #ffffff
line-size = 2pt
pseudo-transparency = true
modules-center = media

padding-left = 1
padding-right = 2
module-margin = 1

separator = |
separator-foreground = ${colors.surface}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10.5;2"
font-1 = "Noto Color Emoji:scale=10;2"
font-2 = "Noto Sans:size=10;2"
font-3 = "Noto Sans Devanagari:size=10;2"
font-4 = "Noto Sans CJK SC:size=10;2"

modules-left = i3
modules-right = network cpu memory pulseaudio date

enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize


[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.red}

label-focused = %name%
label-focused-foreground = ${colors.blue}
label-focused-background = ${colors.surface}
label-focused-underline = ${colors.blue}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

[module/network]
type = custom/script
exec = ~/.config/polybar/network.sh
interval = 5

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.yellow}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.green}
label = %gb_used% / %gb_total%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = "MUTED"
label-muted-foreground = ${colors.subtext}

[module/date]
type = internal/date
interval = 1
date = %a, %b %d  %H:%M
label = %date%
label-foreground = ${colors.text}

[module/media]
type = custom/script
exec = ~/.config/polybar/media.sh
tail = true
format-foreground = ${colors.text}
