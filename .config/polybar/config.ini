[colors]
base = #1e1e2e
surface = #313244
text = #cdd6f4
blue = #89b4fa
green = #a6e3a1
yellow = #f9e2af
red = #f38ba8
subtext = #a6adc8

[bar/main]
width = 100%
height = 28pt
radius = 0
background = ${colors.base}
foreground = ${colors.text}
line-size = 2pt

modules-center = media

padding-left = 1
padding-right = 2
module-margin = 1

separator = |
separator-foreground = ${colors.surface}

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Noto Color Emoji:scale=10;2"
font-2 = "Noto Sans:size=10;2"
font-3 = "Noto Sans Devanagari:size=10;2"
font-4 = "Noto Sans CJK SC:size=10;2"

modules-left = i3
modules-right = network cpu memory pulseaudio date

enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

tray-position = right
tray-maxsize = 16
tray-padding = 4
tray-background = ${colors.base}

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.red}

label-focused = %name%
label-focused-foreground = ${colors.blue}
label-focused-background = ${colors.surface}
label-focused-underline = ${colors.blue}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

[module/network]
type = custom/script
exec = ~/.config/polybar/network.sh
interval = 5

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.yellow}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.green}
label = %gb_used% / %gb_total%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = "MUTED"
label-muted-foreground = ${colors.subtext}

[module/date]
type = internal/date
interval = 1
date = %a, %b %d  %H:%M
label = %date%
label-foreground = ${colors.text}

[module/media]
type = custom/script
exec = ~/.config/polybar/media.sh
tail = true
format-foreground = ${colors.text}
